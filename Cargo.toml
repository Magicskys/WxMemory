[package]
name = "wx_memo"
version = "0.1.0"
edition = "2024"
license = "0BSD"

[dependencies]
openssl = "0.10"
serde = { version = "1", features = ["derive"] }
toml = "1"
libc = "0.2"
chrono = "0.4"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
serde_json = "1"
libsqlite3-sys = { version = "0.40.0", features = ["bundled-sqlcipher-vendored-openssl"] }
tabled = "0.22.0"
clap = { version = "4.6", features = ["derive"] }
zstd = "0.14.4"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
