name: Build macOS arm64

"on":
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: macOS Apple Silicon
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --locked --target aarch64-apple-darwin

      - name: Run Clippy
        run: cargo clippy --locked --target aarch64-apple-darwin -- -D warnings

      - name: Build release binary
        run: cargo build --locked --release --target aarch64-apple-darwin

      - name: Verify and package binary
        shell: bash
        run: |
          binary=target/aarch64-apple-darwin/release/wx_memo
          lipo "$binary" -verify_arch arm64
          otool -L "$binary"
          if otool -L "$binary" | grep -E '/(opt/homebrew|usr/local)/'; then
            echo 'The executable depends on a Homebrew library.' >&2
            exit 1
          fi
          "$binary" --version
          mkdir -p dist/wx_memo-macos-arm64
          cp "$binary" README.md LICENSE dist/wx_memo-macos-arm64/
          tar -czf dist/wx_memo-macos-arm64.tar.gz -C dist wx_memo-macos-arm64

      - name: Upload macOS arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: wx_memo-macos-arm64
          path: dist/wx_memo-macos-arm64.tar.gz
          if-no-files-found: error

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: wx_memo-macos-arm64
          path: dist

      - name: Create release or update its asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          asset=dist/wx_memo-macos-arm64.tar.gz
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$asset" --clobber
          else
            gh release create "$RELEASE_TAG" "$asset" --verify-tag --generate-notes
          fi
